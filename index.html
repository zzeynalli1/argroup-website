<!--
  SECURITY NOTE: Content-Security-Policy, X-Frame-Options,
  X-Content-Type-Options, Referrer-Policy, Permissions-Policy, and
  Strict-Transport-Security are set as real HTTP response headers via
  vercel.json (a <meta> tag can't fully replace real headers) — see that
  file's "headers" block. See README.md "Təhlükəsizlik qeydləri" for details.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tikinti və mühəndislik layihələri üçün etibarlı texniki həllər."
    />
    <title>AR Group Construction Services</title>

    <!--
      Poster-first 3D scene load: preloads the home page's hero poster photo
      ahead of any JS running, so it's already decoded by the time
      Building3DSection's <picture> needs it. Scoped via `media` to the same
      "wide desktop" breakpoint Hero3DScene itself uses to pick this exact
      framing (see Building3DSection.jsx's ScenePoster / Hero3DScene.jsx's
      `detectWideLayout`) — the single most common case for this site's
      desktop-heavy B2B traffic — so narrower/portrait viewports (which will
      pick a different poster) never preload bytes they won't use.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/3d/hero-wide.webp"
      media="(min-width: 1024px) and (min-aspect-ratio: 3/2)"
      fetchpriority="high"
      type="image/webp"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
